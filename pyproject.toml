[project]
name = "icm-platform"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Matheus Buniotto", email = "matheus.buniotto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pydantic-ai>=2.42.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
icm-platform = "icm_platform:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.13",
    "ty>=0.0.1a12",
    "detect-secrets>=1.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901", "PLR0913", "PLR0911", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 4
max-returns = 4
max-statements = 30


