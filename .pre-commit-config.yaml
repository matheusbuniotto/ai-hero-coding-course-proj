repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: '(^|/)uv\.lock$|(^|/)\.secrets\.baseline$'

      - id: no-env-files
        name: block .env files
        entry: bash -c 'echo "Refusing to commit .env files" && exit 1'
        language: system
        files: '(^|/)\.env($|\.)'
